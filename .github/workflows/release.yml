name: Release
run-name: ${{ inputs.prerelease && 'Prerelease' || 'Release' }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag, e.g. v0.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a prerelease'
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: '11.20.0'

      - name: Build trimmed zashboard
        run: bash dashboard/build.sh

      - name: Restore packaging tools
        id: tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/packaging-tools
          key: apk-tools-${{ runner.os }}-26.04-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-tools.sh') }}

      - name: Install packaging dependencies
        env:
          TOOLS_CACHED: ${{ steps.tools.outputs.cache-hit }}
        run: |
          packages=(binutils fakeroot)
          if [[ "$TOOLS_CACHED" != true ]]; then
            packages+=(build-essential meson ninja-build pkg-config libssl-dev zlib1g-dev)
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Package APK and IPK
        env:
          TOOLS_DIR: ${{ runner.temp }}/packaging-tools
        run: |
          bash .github/scripts/prepare-tools.sh
          bash .github/scripts/build-apk.sh
          bash .github/scripts/build-ipk.sh

      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
          BUILD_SHA: ${{ github.sha }}
          NOTES_FILE: ${{ runner.temp }}/sing-box-release-notes.md
        run: |
          bash .github/scripts/release-notes.sh
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            dist/luci-app-sing-box-*.apk dist/luci-app-sing-box_*.ipk \
            --target "$BUILD_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$NOTES_FILE" "${flags[@]}"
